name: CI

on:
  push:
    branches:
      - beta
      - main
  pull_request:
    branches:
      - beta

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Run tests
        run: npm test
      - name: Verify policy integrity
        run: npm run verify
      - name: Run canaries
        run: npm run canary
